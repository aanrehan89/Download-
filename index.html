
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untuk Bocil</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #ff4e8a, #ff9a9e);
      overflow:hidden;
    }

    .love-bg span{
      position:absolute;
      color:white;
      animation: float 6s linear infinite;
      opacity:0.7;
    }

    @keyframes float{
      0%{
        transform: translateY(100vh) scale(0);
      }
      100%{
        transform: translateY(-10vh) scale(1.5);
      }
    }

    .card{
      background:white;
      padding:40px;
      border-radius:25px;
      text-align:center;
      width:350px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
      position:relative;
      z-index:2;
    }

    h1{
      color:#ff2e63;
      margin-bottom:15px;
    }

    p{
      color:#444;
      line-height:1.6;
      margin-bottom:25px;
    }

    .heart{
      font-size:60px;
      animation: beat 1s infinite;
    }

    @keyframes beat{
      0%{ transform: scale(1); }
      50%{ transform: scale(1.2); }
      100%{ transform: scale(1); }
    }

    button{
      background:#ff2e63;
      color:white;
      border:none;
      padding:12px 25px;
      border-radius:30px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#ff004c;
      transform:scale(1.05);
    }

    .hidden-message{
      margin-top:20px;
      display:none;
      color:#ff2e63;
      font-weight:bold;
      font-size:20px;
    }
  </style>
</head>
<body>

  <div class="love-bg" id="loveBg"></div>

  <div class="card">
    <div class="heart">❤️</div>

    <h1>Hai Pendek</h1>

    <p>
      Aku cuma mau bilang...<br><br>
      Sejak kenal kamu, hari-hari aku jadi lebih indah 
    </p>

    <button onclick="showLove()">Klik Dong 😳</button>

    <div class="hidden-message" id="loveMessage">
      BOCILLL 16TH 150CM😝
    </div>
  </div>

  <script>
    function showLove(){
      document.getElementById("loveMessage").style.display = "block";
    }

    const loveBg = document.getElementById("loveBg");

    for(let i = 0; i < 30; i++){
      let span = document.createElement("span");
      span.innerHTML = "❤️";

      span.style.left = Math.random() * 100 + "%";
      span.style.animationDelay = Math.random() * 5 + "s";
      span.style.fontSize = (15 + Math.random() * 20) + "px";

      loveBg.appendChild(span);
    }
  </script>

</body>
</html>
